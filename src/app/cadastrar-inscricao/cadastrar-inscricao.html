<div class="container">
  <h2>Cadastrar Inscrição em Oficina</h2>

  <form (ngSubmit)="cadastrar()">
    <div>
      <label for="nome">Nome:</label>
      <input type="text" id="nome" [(ngModel)]="nome" name="nome" required />
    </div>

    <div>
      <label for="email">E-mail:</label>
      <input type="email" id="email" [(ngModel)]="email" name="email" required />
    </div>

    <div>
      <label for="oficina">Oficina:</label>
      <select id="oficina" [(ngModel)]="oficina" name="oficina" required>
        <option value="">Selecione uma oficina</option>
        <option value="Desenvolvimento Angular">Desenvolvimento Angular</option>
        <option value="Lógica de Programação">Lógica de Programação</option>
        <option value="Banco de Dados SQL">Banco de Dados SQL</option>
      </select>
    </div>

    <br />
    <button type="submit">Cadastrar</button>
  </form>

  <br />
  <a routerLink="/lista">Ir para a Lista de Inscrições</a>
</div>
